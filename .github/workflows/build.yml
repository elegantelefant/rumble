# ABOUTME: CI workflow that builds distributable binaries for macOS and Windows.
# ABOUTME: Builds Vue frontend, PyInstaller sidecar, and Tauri app per platform.

name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            bundle: app
          - runner: macos-13
            target: x86_64-apple-darwin
            bundle: app
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install frontend deps
        run: pnpm install

      - name: Install sidecar deps
        run: uv sync
        working-directory: src-tauri/sidecar

      - name: Build sidecar (Unix)
        if: runner.os != 'Windows'
        run: |
          uv run pyinstaller sidecar.spec --noconfirm
          cp dist/rumble-sidecar ../binaries/rumble-sidecar-${{ matrix.target }}
        working-directory: src-tauri/sidecar

      - name: Build sidecar (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller sidecar.spec --noconfirm
          copy dist\rumble-sidecar.exe ..\binaries\rumble-sidecar-${{ matrix.target }}.exe
        working-directory: src-tauri/sidecar
        shell: cmd

      - name: Build Tauri app
        run: pnpm tauri build --bundles ${{ matrix.bundle }}

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: rumble-${{ matrix.target }}
          path: src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rumble-${{ matrix.target }}
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
