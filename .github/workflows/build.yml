# ABOUTME: CI workflow that builds distributable binaries for macOS, Windows, and Linux.
# ABOUTME: Builds Vue frontend, PyInstaller sidecar, and Tauri app per platform.

name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon only
          - runner: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          # Windows — x64 (unsigned preview)
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi,nsis
          # Linux — x64 (unsigned preview)
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,appimage

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set build version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package["version"] = version
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          for filename, section in (
              ("src-tauri/Cargo.toml", "package"),
              ("src-tauri/sidecar/pyproject.toml", "project"),
          ):
              path = Path(filename)
              pattern = rf'(?ms)(^\[{section}\]\n(?:(?!^\[).)*?^version\s*=\s*")[^"]+(")'
              content, count = re.subn(
                  pattern, lambda match: match[1] + version + match[2], path.read_text()
              )
              if count != 1:
                  raise ValueError(f"Expected one [{section}] version in {filename}")
              path.write_text(content)

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install frontend deps
        run: pnpm install

      - name: Install sidecar deps
        run: uv sync
        working-directory: src-tauri/sidecar

      - name: Build sidecar (Unix)
        if: runner.os != 'Windows'
        run: |
          uv run pyinstaller sidecar.spec --noconfirm
          mkdir -p ../binaries
          cp dist/rumble-sidecar ../binaries/rumble-sidecar-${{ matrix.target }}
        working-directory: src-tauri/sidecar

      - name: Build sidecar (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller sidecar.spec --noconfirm
          if not exist ..\binaries mkdir ..\binaries
          copy dist\rumble-sidecar.exe ..\binaries\rumble-sidecar-${{ matrix.target }}.exe
        working-directory: src-tauri/sidecar
        shell: cmd

      - name: Configure macOS ad-hoc signing
        if: runner.os == 'macOS'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      - name: Build Tauri app
        run: pnpm tauri build --bundles ${{ matrix.bundle }}

      - name: Verify macOS app and launch bundled sidecar
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -eq 0 ]; then
            echo 'No macOS dmg found' >&2
            exit 1
          fi
          mount_dir=$(mktemp -d "${TMPDIR:-/tmp}/rumble-signing.XXXXXX")
          detach_mount() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if [ "$attempt" -eq 5 ]; then
                hdiutil detach -force "$mount_dir" || true
              elif hdiutil detach "$mount_dir"; then
                return 0
              else
                sleep 2
              fi
            done
          }
          trap 'detach_mount >/dev/null 2>&1 || true; rmdir "$mount_dir" || true' EXIT
          for dmg in "${dmgs[@]}"; do
            hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
            app="$mount_dir/Elefant - Rumble.app"
            codesign --verify --deep --strict --verbose=2 "$app"
            "$app/Contents/MacOS/rumble-sidecar" --help
            detach_mount
          done

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: rumble-${{ matrix.target }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rumble-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rumble-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Create a GitHub release when triggered by a version tag
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
