# ABOUTME: CI workflow that builds distributable binaries for macOS, Windows, and Linux.
# ABOUTME: Builds Vue frontend, PyInstaller sidecar, and Tauri app per platform.

name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon (Intel Macs run via Rosetta 2)
          - runner: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
          # Windows — x64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi,nsis
          # Linux — x64
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb,appimage

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install frontend deps
        run: pnpm install

      - name: Install sidecar deps
        run: uv sync
        working-directory: src-tauri/sidecar

      - name: Build sidecar (Unix)
        if: runner.os != 'Windows'
        run: |
          uv run pyinstaller sidecar.spec --noconfirm
          mkdir -p ../binaries
          cp dist/rumble-sidecar ../binaries/rumble-sidecar-${{ matrix.target }}
        working-directory: src-tauri/sidecar

      - name: Build sidecar (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller sidecar.spec --noconfirm
          if not exist ..\binaries mkdir ..\binaries
          copy dist\rumble-sidecar.exe ..\binaries\rumble-sidecar-${{ matrix.target }}.exe
        working-directory: src-tauri/sidecar
        shell: cmd

      - name: Build Tauri app
        run: pnpm tauri build --bundles ${{ matrix.bundle }}

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: rumble-${{ matrix.target }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: rumble-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: rumble-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Create a GitHub release when triggered by a version tag
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
