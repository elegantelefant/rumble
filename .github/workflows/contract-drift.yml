# ABOUTME: Fails CI when the committed generated contract types drift from openapi.json.
# ABOUTME: Regenerates the orval TS types and the Pydantic sidecar models, then diffs.

name: Contract Drift

# This gate catches "openapi.json changed but the generated types weren't
# regenerated/committed". openapi.json is the sidecar's own spec — it does not
# track birepo's elefant-api; premium cloud call sites consume
# @elefant/api-contract directly (see agent_docs/2026-09-02-contract-0207-*.md).

on:
  push:
  pull_request:
    branches: [main]

jobs:
  drift:
    name: Generated types match openapi.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: pnpm install

      - run: uv sync
        working-directory: src-tauri/sidecar

      - name: Regenerate orval TS types
        run: pnpm generate:api

      - name: Regenerate Pydantic sidecar models
        run: pnpm generate:models

      - name: Fail on uncommitted regeneration drift
        run: git diff --exit-code -- src/api/models src-tauri/sidecar/models/generated.py
