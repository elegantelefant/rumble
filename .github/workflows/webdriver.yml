# ABOUTME: Selenium E2E tests via headless Chrome against Vite preview.
# ABOUTME: Builds the Vue frontend, serves via preview, runs selenium tests.

name: WebDriver E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selenium:
    name: Selenium (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install

      # Chrome is pre-installed on GitHub runners.
      # Selenium Manager (bundled with selenium-webdriver 4.34+)
      # auto-downloads a matching chromedriver — no manual install needed.

      - run: npm install
        working-directory: selenium-tests

      - name: Selenium (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: xvfb-run npm test
        working-directory: selenium-tests

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.platform }}
          path: e2e-screenshots/
          if-no-files-found: ignore
