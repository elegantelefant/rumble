# ABOUTME: Selenium e2e tests via tauri-driver on Linux and Windows.
# ABOUTME: Builds the full app then runs smoke tests against the real binary.

name: WebDriver E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selenium:
    name: Selenium (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libxdo-dev libssl-dev webkit2gtk-driver xvfb

      - name: Install Windows Edge Driver
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          "$PWD" | Out-File -FilePath $env:GITHUB_PATH -Append

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: pnpm install

      - run: uv sync
        working-directory: src-tauri/sidecar

      # Build sidecar binary for this platform
      - name: Build sidecar (Unix)
        if: runner.os != 'Windows'
        run: |
          uv run pyinstaller sidecar.spec --noconfirm
          mkdir -p ../binaries
          TRIPLE=$(rustc -vV | grep host | cut -d' ' -f2)
          cp dist/rumble-sidecar ../binaries/rumble-sidecar-$TRIPLE
        working-directory: src-tauri/sidecar

      - name: Build sidecar (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run pyinstaller sidecar.spec --noconfirm
          if not exist ..\binaries mkdir ..\binaries
          copy dist\rumble-sidecar.exe ..\binaries\rumble-sidecar-x86_64-pc-windows-msvc.exe
        working-directory: src-tauri/sidecar
        shell: cmd

      - run: cargo install tauri-driver --locked

      - run: npm install
        working-directory: selenium-tests

      - name: Selenium (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: xvfb-run npm test
        working-directory: selenium-tests

      - name: Selenium (Windows)
        if: matrix.platform == 'windows-latest'
        run: npm test
        working-directory: selenium-tests
