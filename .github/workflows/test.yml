# ABOUTME: CI workflow that runs frontend, Python, and Rust tests on every push/PR.
# ABOUTME: Three parallel jobs on ubuntu-latest for fast feedback.

name: Test

on:
  push:
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - run: pnpm install
      - run: pnpm vitest run

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - run: uv sync
        working-directory: src-tauri/sidecar

      - run: uv run pytest -q
        working-directory: src-tauri/sidecar

  rust:
    name: Rust (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Create sidecar stub for Tauri build script
        run: |
          mkdir -p src-tauri/binaries
          touch src-tauri/binaries/rumble-sidecar-x86_64-unknown-linux-gnu

      - run: cargo test
        working-directory: src-tauri
