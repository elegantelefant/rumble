# ABOUTME: Python sidecar project manifest for rumble local AI backend.
# ABOUTME: Manages deps for FastAPI server, PydanticAI agents, and SQLite storage.

[project]
name = "rumble-sidecar"
version = "0.1.0"
description = "Local AI sidecar for Elefant Rumble (Ollama + BYOK)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-ai>=0.1",
    "aiosqlite>=0.21",
    "httpx>=0.28",
    "sse-starlette>=2.2",
]

[project.scripts]
rumble-sidecar = "main:cli"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.26",
    "pyinstaller>=6.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.datamodel-codegen]
input = "../../openapi.json"
output = "models/generated.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
# Spec marks ULID ids as string/format=ulid. Without this, datamodel-codegen
# emits `from ulid import ULID`, a non-Pydantic type that breaks schema build.
# Map it to a pattern-constrained str instead.
type-mappings = ["string+ulid=string"]
# 0.4.0 flipped wire fields to camelCase. The sidecar (and its FE client) speak
# snake_case on their own local routes, so emit pure snake_case Python models with
# no camelCase aliases (FastAPI would otherwise serialize responses by alias).
snake-case-field = true
no-alias = true
# Deterministic output so the contract-drift CI gate doesn't trip on a timestamp.
disable-timestamp = true
